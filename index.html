    <style>
            #giqui-loader {
                position: fixed;
                inset: 0;
                z-index: 99999;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 1.2rem;
                background: #ffffff;
                font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            }
            .giqui-loader-mark {
                width: 7.2rem;
                height: 7.2rem;
                display: grid;
                place-items: center;
                border-radius: 1.8rem;
                background: #ff444f;
                color: #ffffff;
                font-size: 3.8rem;
                font-weight: 800;
                box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.12);
            }
            .giqui-loader-name {
                color: #111827;
                font-size: 3rem;
                font-weight: 800;
                letter-spacing: -0.04em;
            }
            .giqui-loader-spinner {
                width: 2.4rem;
                height: 2.4rem;
                border: 0.3rem solid #e5e7eb;
                border-top-color: #ff444f;
                border-radius: 50%;
                animation: giqui-spin 0.8s linear infinite;
            }
            .giqui-loader-text {
                color: #6b7280;
                font-size: 1.4rem;
            }
            @keyframes giqui-spin {
                to { transform: rotate(360deg); }
            }
        </style>
